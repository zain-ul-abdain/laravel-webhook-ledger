name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Version coverage. SQLite keeps this matrix fast; the engine-specific
  # behaviour is covered by the `databases` job below.
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # Laravel and Testbench are version-locked to each other, and each has its
      # own PHP floor (L12 -> PHP 8.2, L13 -> PHP 8.3). Pairing them explicitly
      # is clearer than a full cross-product plus a list of exclusions.
      matrix:
        include:
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
        env:
          DB_DRIVER: sqlite

  # Engine coverage. The deduplication guarantee rests on constraint-violation
  # behaviour, which differs by engine: PostgreSQL aborts the enclosing
  # transaction where MySQL and SQLite do not. A suite that only runs on SQLite
  # cannot establish that the duplicate path is correct.
  databases:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        driver: [pgsql, mysql]

    name: ${{ matrix.driver }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testing -d testing"
          --health-interval 5s --health-timeout 5s --health-retries 10

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: testing
          MYSQL_PASSWORD: testing
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptesting"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_pgsql, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
        env:
          DB_DRIVER: ${{ matrix.driver }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.driver == 'pgsql' && '5432' || '3306' }}
          DB_DATABASE: testing
          DB_USERNAME: testing
          DB_PASSWORD: testing

  lint:
    runs-on: ubuntu-latest
    name: Pint

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test
